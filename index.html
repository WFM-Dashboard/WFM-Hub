<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in | WFM Transitions Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--card:#111b31;--card-2:#16233f;--line:#1f2d4a;--line-2:#2b3c60;--text:#e8eefc;--dim:#9dabc7;--faint:#7686a6;--blue:#4d8dff;--blue-dim:rgba(77,141,255,.14);--green:#2fcf94}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px;min-height:100vh}
.wrap{width:100%;max-width:460px}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:26px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none}
.brand-t{font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.15}
.brand-t small{display:block;font-weight:500;font-size:12.5px;color:var(--faint);letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 18px 48px rgba(2,6,18,.45)}
h1{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.02em}
.lead{margin:0 0 22px;color:var(--dim)}
.opt{border:1px solid var(--line);border-radius:12px;padding:18px;background:rgba(255,255,255,.02)}
.opt h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
.opt h2 .ic{color:var(--blue)}
.opt p{margin:4px 0 14px;color:var(--dim);font-size:13px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:7px}
.field{position:relative}
input{width:100%;font:inherit;font-size:15px;color:var(--text);background:#0c1630;border:1px solid var(--line-2);border-radius:10px;padding:12px 70px 12px 14px}
input::placeholder{color:var(--faint)}
input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.show{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer}
.show:hover{color:var(--text)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.err{min-height:20px;margin:8px 0 0;color:#ff8a99;font-size:13px;font-weight:600}
.btn{width:100%;height:46px;border-radius:10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn.primary{border:0;background:var(--blue);color:#fff;margin-top:4px}
.btn.primary:hover{background:#6aa0ff}
.btn.outline{border:1px solid var(--line-2);background:var(--card-2);color:var(--text)}
.btn.outline:hover{border-color:#4a5f8c;background:#1b2a4a}
.btn[disabled]{opacity:.65;cursor:progress}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--faint);font-size:12.5px;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.foot{margin-top:18px;text-align:center;color:var(--faint);font-size:12.5px}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
noscript{display:block;color:#ff8a99;text-align:center;margin-top:16px}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 4 8-10"/><path d="M15 5h5v5"/></svg></div>
    <div class="brand-t">WFM Transitions Hub<small>Operations portfolio</small></div>
  </div>

  <section class="card" aria-labelledby="t">
    <h1 id="t">Welcome</h1>
    <p class="lead">Choose how you want to open the dashboard.</p>

    <form class="opt" id="adminForm" autocomplete="off">
      <h2><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Admin Login</h2>
      <p>Full access, including editing and admin tools. Password required.</p>
      <label for="pw">Admin password</label>
      <div class="field">
        <input id="pw" type="password" placeholder="Enter password" autocomplete="current-password" required>
        <button class="show" id="show" type="button" aria-label="Show password">Show</button>
      </div>
      <p class="err" id="err" role="alert" aria-live="assertive"></p>
      <button class="btn primary" id="go" type="submit">Log in as Admin</button>
    </form>

    <div class="or" aria-hidden="true">or</div>

    <div class="opt">
      <h2><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Continue as Viewer</h2>
      <p>View-only access to the dashboard. No password needed.</p>
      <button class="btn outline" id="viewer" type="button">Continue as Viewer</button>
    </div>
    <noscript>JavaScript is required to open this dashboard.</noscript>
  </section>
  <p class="foot">WFM Transitions Hub</p>
</main>

  var KEY = 'wth_key', ROLE = 'wth_role';
  var f = document.getElementById('adminForm'), pw = document.getElementById('pw'), err = document.getElementById('err'),
      go = document.getElementById('go'), show = document.getElementById('show'), viewerBtn = document.getElementById('viewer');

  function bytes(b64){ var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function toB64(buf){ var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function openPage(html){ document.open(); document.write(html); document.close(); }

  function openViewer(){
    try { sessionStorage.removeItem(KEY); sessionStorage.setItem(ROLE, 'viewer'); } catch(e) {}
    openPage(new TextDecoder().decode(bytes(VIEWER)));
  }
  async function deriveKey(password){
    var mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(ADMIN.salt), iterations:ADMIN.iter, hash:'SHA-256'}, mat, {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  async function openAdmin(key){
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(ADMIN.iv)}, key, bytes(ADMIN.data));
    openPage(new TextDecoder().decode(plain));
  }
  function fail(msg){
    err.textContent = msg; go.disabled = false; go.textContent = 'Log in as Admin';
    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    pw.focus(); pw.select();
  }

  show.addEventListener('click', function(){
    var hidden = pw.type === 'password';
    pw.type = hidden ? 'text' : 'password';
    show.textContent = hidden ? 'Hide' : 'Show';
    show.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  });
  viewerBtn.addEventListener('click', openViewer);

  f.addEventListener('submit', async function(e){
    e.preventDefault();
    err.textContent = '';
    if (!window.crypto || !crypto.subtle) { fail('Admin login needs a current browser opened from the https:// address.'); return; }
    go.disabled = true; go.textContent = 'Checking...';
    try {
      var key = await deriveKey(pw.value);
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(ADMIN.iv)}, key, bytes(ADMIN.data));
      try { sessionStorage.setItem(KEY, toB64(await crypto.subtle.exportKey('raw', key))); sessionStorage.setItem(ROLE, 'admin'); } catch(x) {}

      try { sessionStorage.removeItem(KEY); } catch(y) {}
      fail('Incorrect password. Please try again.');
    }

  // Stay signed in while this browser tab stays open (Log Out or closing the tab ends it)
  (async function(){
    try {
      var role = sessionStorage.getItem(ROLE);
      if (role === 'viewer') { openViewer(); return; }
      var saved = sessionStorage.getItem(KEY);
      if (role === 'admin' && saved && window.crypto && crypto.subtle) {
        await openAdmin(await crypto.subtle.importKey('raw', bytes(saved), {name:'AES-GCM'}, false, ['decrypt']));
      }
    } catch (x) { try { sessionStorage.removeItem(KEY); sessionStorage.removeItem(ROLE); } catch(y) {} }
  })();
